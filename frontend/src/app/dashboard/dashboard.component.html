<app-navbar></app-navbar>
<div class="container">
  <header>
    <h1>Home</h1>
  </header>
  <div class="content">
    <div *ngFor="let post of posts" class="post-container">
      <div class="post-header">
        <img [src]="post.user.profileImage" alt="User Image">
        <div>
          <strong>{{ post.userName }}</strong>
          <p>{{ post.createdAt }}</p> <!-- Display "x time ago" -->
        </div>
      </div>
      <div class="post-content">
        <p>{{ post.body }}</p>
      </div>
      <div class="post-actions">
        <button>Like</button>
        <button (click)="toggleComments(post.id)">Comment</button>
      </div>
      <div class="comments" *ngIf="showComments[post.id]">
        <div *ngFor="let comment of comments[post.id]" class="comment-box">
          <p><strong>{{ comment.author }}</strong>: {{ comment.content }}</p>
          <p>{{ comment.createdAt }}</p> <!-- Display "x time ago" -->
        </div>
        <div class="add-comment">
          <input type="text" [(ngModel)]="newComment[post.id]" placeholder="Add a comment">
          <button (click)="addComment(post.id)">Post</button>
        </div>
      </div>
    </div>
  </div>
</div>
