<app-navbar></app-navbar>
<div class="container">
  <header>
    <h1>Home</h1>
  </header>
  <div class="content">
    <div *ngFor="let post of posts" class="post-container">
      <div class="post-header">
        <img [src]="post.user.profileImage" alt="User Image">
        <div>
          <strong>{{ post.userName }}</strong>
          <p>{{ post.createdAt | date:'short' }}</p>
        </div>
      </div>
      <div class="post-content">
        <p>{{ post.body }}</p>
      </div>
      <div class="post-actions">
        <button>Like</button>
        <button>Comment</button>
      </div>
    </div>
  </div>
</div>
